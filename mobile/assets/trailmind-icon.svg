<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="TrailMind">
  <!--
    TrailMind app icon — source of truth.

    Palette is taken verbatim from mobile/src/theme/theme.ts so the icon and the
    app cannot drift apart:
      paper        #faf4e9   background
      ink          #211a14   the trail
      marigold     #e8a13c   the insight point
      marigoldDeep #c9821f   its shadow edge

    CONCEPT: a trail that rises and resolves into a single marked point — the
    moment a route becomes knowledge. Deliberately NOT a mountain range or a
    compass rose: those are the generic outdoor-tourism marks this brand was
    explicitly told not to look like. One path, one destination, no scenery.

    LEGIBILITY: the whole mark sits inside the centre 66% of the canvas, so
    Android's adaptive-icon circle/squircle mask cannot clip it. Strokes are
    56-64px at 1024 (≈2.6px at 48px) which stays solid at the smallest launcher
    size. Two colours carry the whole design, so it survives greyscale and the
    monochrome themed-icon treatment.
  -->
  <rect width="1024" height="1024" fill="#faf4e9"/>

  <!-- The trail: one continuous rising path, widest at the base (near, solid)
       and tapering as it climbs (far). Round caps/joins keep it friendly
       rather than technical. -->
  <path
    d="M 300 812
       C 300 700, 470 690, 470 578
       C 470 470, 330 452, 330 344"
    fill="none"
    stroke="#211a14"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Trail markers: two short ticks crossing the path, the way a waymarked
       route is blazed. They also break up the curve so it reads as a *trail*
       and not an arbitrary squiggle at small sizes. -->
  <path d="M 396 640 L 466 664" fill="none" stroke="#211a14" stroke-width="30" stroke-linecap="round" opacity="0.42"/>
  <path d="M 356 486 L 424 462" fill="none" stroke="#211a14" stroke-width="30" stroke-linecap="round" opacity="0.42"/>

  <!-- The insight point: where the trail arrives. Marigold, offset shadow edge
       underneath for a little depth without introducing a gradient (gradients
       band badly at launcher sizes and break monochrome export). -->
  <circle cx="330" cy="300" r="86" fill="#c9821f"/>
  <circle cx="330" cy="288" r="86" fill="#e8a13c"/>

  <!-- A single ink notch inside the point, so the marigold circle reads as a
       deliberate marker rather than a stray dot. -->
  <circle cx="330" cy="288" r="26" fill="#211a14"/>

  <!-- Ground line: anchors the trail so it starts somewhere instead of
       floating. Short, low contrast, purely supporting. -->
  <path d="M 232 856 L 632 856" fill="none" stroke="#211a14" stroke-width="30" stroke-linecap="round" opacity="0.18"/>
</svg>
